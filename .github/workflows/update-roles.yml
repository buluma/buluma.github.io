name: Update Ansible roles

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-roles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install PyYAML

      - name: Check pull request token
        env:
          ROLE_SYNC_TOKEN: ${{ secrets.ROLE_SYNC_TOKEN }}
        run: |
          if [ -z "$ROLE_SYNC_TOKEN" ]; then
            echo "::error::Set the ROLE_SYNC_TOKEN repository secret before running this workflow."
            exit 1
          fi

      - name: Sync roles from GitHub
        run: python scripts/update_roles.py sync
        env:
          GITHUB_TOKEN: ${{ secrets.ROLE_SYNC_TOKEN }}

      - name: Open or update role list pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.ROLE_SYNC_TOKEN }}
          branch: automation/update-ansible-roles
          delete-branch: true
          base: master
          add-paths: |
            _data/ansible_roles.yml
            _data/ansible_role_repositories.yml
          commit-message: Update Ansible role list
          title: Update Ansible role list
          body: |
            Refresh the Ansible Galaxy role index and GitHub repository slug mapping from public `buluma/ansible-role-*` repositories.
            Galaxy role names use underscores, and archived repositories are excluded.
